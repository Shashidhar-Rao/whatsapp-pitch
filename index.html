<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp: The Execution Layer</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<style>
  .hide-scrollbar{scrollbar-width:none}
  .hide-scrollbar::-webkit-scrollbar{display:none}
  ::selection{background:#25D366;color:#fff}
</style>
</head>
<body class="min-h-screen bg-[#f0f2f5] font-sans text-gray-800">
<header class="bg-[#128C7E] text-white py-6 px-4 shadow-md sticky top-0 z-50">
  <div class="max-w-6xl mx-auto">
    <h1 class="text-2xl font-bold tracking-tight">WhatsApp: The Execution Layer</h1>
    <p class="text-teal-100 text-sm mt-1 font-medium tracking-wide uppercase">A Builder Operator Proposal</p>
  </div>
</header>

<main class="max-w-6xl mx-auto py-8 px-4 sm:px-6">
  <div class="bg-white rounded-t-2xl border-b border-gray-200 overflow-hidden shadow-sm">
    <div id="tabs" class="flex flex-col sm:flex-row w-full bg-[#128C7E]"></div>
  </div>
  <div id="content" class="bg-white rounded-b-2xl shadow-md p-6 md:p-10 border border-t-0 border-gray-100"></div>
</main>

<script>
const I = (n, s = 16, c = '') => `<i data-lucide="${n}" width="${s}" height="${s}" class="${c}"></i>`;

const tabs = [
  { title: "Summary", icon: "file-text", label: "Vision" },
  { title: "Marketplace", icon: "briefcase", label: "B2B" },
  { title: "Utility", icon: "wallet", label: "B2C" },
  { title: "Network", icon: "message-circle", label: "B2C & B2B" },
  { title: "Ecosystem", icon: "trending-up", label: "ROI" },
];

/* ---------- Reusable blocks ---------- */
const infoStyles = {
  default: "bg-white border-gray-200 text-gray-800",
  insight: "bg-[#E1F5E8] border-[#25D366]/30 text-[#075E54]",
  tradeoff: "bg-orange-50 border-orange-200 text-orange-900",
  dont: "bg-red-50 border-red-200 text-red-900",
};
const infoColors = {
  default: "text-[#128C7E]", insight: "text-[#128C7E]",
  tradeoff: "text-orange-600", dont: "text-red-600",
};
const Info = (title, icon, content, type = 'default') => `
  <div class="p-4 rounded-xl border ${infoStyles[type]} shadow-sm">
    <h4 class="font-bold flex items-center gap-2 mb-2 uppercase tracking-wide text-xs ${infoColors[type]}">${I(icon)} ${title}</h4>
    <p class="text-sm font-medium leading-relaxed">${content}</p>
  </div>`;

const Four = (product, insight, tradeoff, dont) =>
  Info("The Product", "layers", product) +
  Info("Customer Insight", "lightbulb", insight, "insight") +
  Info("Tradeoffs", "alert-triangle", tradeoff, "tradeoff") +
  Info("Don'ts", "x-octagon", dont, "dont");

const Bubble = (text, type, time, sender, color) => {
  const sent = type === 'sent';
  return `
  <div class="flex w-full mb-3 relative z-10 ${sent ? 'justify-end' : 'justify-start'}">
    <div class="relative max-w-[85%] px-3 py-1.5 rounded-lg shadow-sm text-sm ${sent ? 'bg-[#DCF8C6] rounded-tr-none' : 'bg-white rounded-tl-none'} text-gray-800">
      ${sender && !sent ? `<div class="font-bold text-xs mb-1 ${color || 'text-[#128C7E]'}">${sender}</div>` : ''}
      <span class="leading-snug">${text}</span>
      <div class="text-[9px] text-gray-500 text-right mt-1 ml-4 flex justify-end items-center gap-1">${time}${sent ? I('check-check', 12, 'text-[#53bdeb]') : ''}</div>
    </div>
  </div>`;
};

const Phone = (title, children, isBusiness = false, cls = '') => `
  <div class="w-[260px] h-[500px] bg-[#ECE5DD] rounded-[2rem] border-8 border-gray-900 shadow-xl overflow-hidden flex flex-col relative shrink-0 ${cls}">
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-24 h-5 bg-gray-900 rounded-b-xl z-50"></div>
    <div class="${isBusiness ? 'bg-[#1e2a30]' : 'bg-[#128C7E]'} text-white py-2 px-3 flex items-center justify-between pt-7 z-40 shadow-sm">
      <div class="flex items-center gap-2">
        ${I('arrow-left', 18)}
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-full bg-white/20 flex items-center justify-center text-xs font-bold">${title.charAt(0)}</div>
          <span class="font-bold text-sm tracking-wide truncate max-w-[100px]">${title}</span>
        </div>
      </div>
      <div class="flex gap-3">${I('camera', 16)}${I('more-vertical', 16)}</div>
    </div>
    <div class="flex-1 overflow-y-auto p-2 relative flex flex-col">
      <div class="absolute inset-0 opacity-[0.06] pointer-events-none" style="background-image:radial-gradient(#075E54 1px,transparent 1px);background-size:16px 16px"></div>
      <div class="relative z-10 flex flex-col h-full">${children}</div>
    </div>
    ${!isBusiness ? `
    <div class="bg-[#f0f2f5] p-2 flex gap-2 items-center z-40">
      <div class="flex-1 bg-white rounded-full flex items-center px-3 py-1.5 text-gray-400">
        <span class="text-xs">Message</span>
        <div class="ml-auto flex gap-2 text-gray-500">${I('paperclip', 16)}${I('camera', 16)}</div>
      </div>
      <div class="w-8 h-8 rounded-full bg-[#128C7E] text-white flex items-center justify-center flex-shrink-0">${I('mic', 16)}</div>
    </div>` : ''}
  </div>`;

/* ---------- Tabs ---------- */
const SummaryTab = () => `
  <div class="max-w-3xl mx-auto py-8">
    <div class="bg-white rounded-2xl p-8 shadow-sm border border-gray-100 relative overflow-hidden">
      <div class="absolute top-0 left-0 w-2 h-full bg-[#25D366]"></div>
      <h2 class="text-2xl font-bold text-gray-900 mb-6 flex items-center gap-3">
        <span class="bg-[#E1F5E8] text-[#128C7E] p-2 rounded-lg">${I('file-text', 24)}</span>
        Executive Summary
      </h2>
      <div class="text-gray-700 text-lg leading-relaxed font-medium space-y-5">
        <p>You shared a clear vision for WhatsApp yesterday in your tweet. WhatsApp is already a shared language for three billion people. However, communication is currently separated from execution. Users talk about tasks but must leave the application to complete them.</p>
        <p>I spent the last few hours brainstorming how we can bridge this exact gap. I mapped out ways to embed context directly into conversations without adding visual clutter. This proposal outlines a strict product strategy to turn chats into an execution layer. We focused entirely on maintaining the simple interface while creating net new utility for the end user.</p>
        <p>This approach keeps personal messaging free and strictly private. At the same time, it creates massive commercial value for the business ecosystem. We can generate high margin revenue by connecting user intent to verified services. The entire platform benefits from this flywheel without compromising our core trust.</p>
      </div>
    </div>
  </div>`;

const MarketplaceTab = () => `
  <div class="flex flex-col lg:flex-row gap-10 items-start">
    <div class="flex-1 space-y-4 lg:max-w-md shrink-0">
      ${Four(
        "The AI Search Bar and B2B Interoperability. The current chat option does not have interoperability with B2B businesses that use WhatsApp. If I am searching for a CA on the AI bar, I should be able to get a curated list. We solve this by parsing intent and matching it with verified providers. Providers use a Pay to Quote token model to respond.",
        "Users want immediate help from local professionals but refuse to browse static directories. They want to state their problem once and receive actionable quotes natively in their chat.",
        "Banning high risk manual services from independent listing sacrifices some margin. However, it protects the brand from massive dispute resolution overhead.",
        "Do not build a Google style web search bar. Do not charge a percentage of the final transaction to prevent off platform cash leakage.")}
    </div>
    <div class="flex-1 w-full flex flex-col gap-6 items-center">
      <div class="flex flex-col sm:flex-row gap-6 justify-center w-full items-center sm:items-start">
        ${Phone("Meta AI",
          Bubble("I need a CA who understands startup taxation in Bengaluru.", "sent", "10:00 AM") +
          Bubble("I am sending an anonymous brief to verified Startup CAs nearby. I will drop their curated quotes here shortly.", "received", "10:01 AM", "Meta AI", "text-[#075E54]"))}
        ${Phone("WA Pro Leads", `
          <div class="bg-[#1e2a30] text-[#DCF8C6] text-xs font-bold text-center py-2 border-b border-gray-700">Wallet: 18 Tokens Remaining</div>
          <div class="m-3 bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="p-4 border-b border-gray-100">
              <div class="flex justify-between items-start mb-2">
                <span class="bg-blue-100 text-blue-700 text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wider">New Lead</span>

              </div>
              <h4 class="font-bold text-gray-900">Startup CA in Bengaluru</h4>
              <p class="text-sm text-gray-600 mt-2 italic line-clamp-2">"I need a CA who understands startup taxation..."</p>
            </div>
            <div class="p-3">
              <button class="w-full bg-[#128C7E] text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 hover:bg-[#075E54]">
                <span class="bg-white/20 rounded-full w-6 h-6 flex items-center justify-center text-xs">🪙 1</span>
                Spend Token to Quote
              </button>
            </div>
          </div>`, true)}
      </div>
      <div class="flex justify-center w-full">
        ${Phone("Meta AI",
          `<div class="text-xs text-center text-gray-500 my-2 font-bold uppercase tracking-wide">Curated Results</div>` +
          [1, 2].map(i => `
            <div class="mx-2 mb-3 bg-white p-3 rounded-xl border border-gray-200 shadow-sm flex flex-col gap-2">
              <div class="flex justify-between items-start">
                <div>
                  <div class="font-bold text-sm text-gray-900 flex items-center gap-1">Tax Advisors LLP ${I('check', 12, 'bg-[#25D366] text-white rounded-full p-0.5')}</div>

              <div class="flex gap-2 mt-1">

                <button class="flex-1 bg-gray-100 text-gray-700 text-xs font-bold py-2 rounded">Book</button>

const UtilityTab = () => `
  <div class="flex flex-col lg:flex-row gap-10">

    </div>
    <div class="lg:w-[560px] flex gap-6 overflow-x-auto pb-4 snap-x hide-scrollbar">
      ${Phone("Dinner Group",
        Bubble("Dinner was amazing. Here is the bill.", "received", "9:15 PM", "Alex", "text-[#075E54]") + `
        <div class="ml-2 mr-6 my-2 bg-white p-2 rounded-lg shadow-sm border border-gray-200 relative">
          <div class="w-full h-36 bg-gray-100 rounded border border-gray-200 flex items-center justify-center flex-col text-gray-400">
            ${I('file-text', 32)}

        </div>`, false, "snap-center")}
      ${Phone("Dinner Group", `
        <div class="mx-2 my-4 bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden relative">
          <div class="bg-[#128C7E] px-4 py-3 flex justify-between items-center text-white">
            <span class="font-bold text-sm">El Gaucho Dinner</span>
            <span class="bg-[#075E54] px-2 py-0.5 rounded-full text-xs font-bold shadow-inner">₹2,500</span>
          </div>
          <div class="p-4 space-y-4">
            <div class="flex justify-between items-center text-sm border-b border-gray-100 pb-2">
              <span class="text-gray-500 font-bold uppercase tracking-wide text-xs">Your Share</span>
              <span class="font-bold text-gray-900 text-lg">₹833</span>
            </div>
            <div class="space-y-3">
              <div class="flex items-center justify-between text-sm">
                <div class="flex items-center gap-2">${I('check-check', 16, 'text-[#128C7E]')}<span class="text-gray-400 line-through font-medium">Alex</span></div>
                <span class="text-gray-400 line-through text-xs font-bold">₹833</span>
              </div>
              <div class="flex items-center justify-between text-sm">
                <div class="flex items-center gap-2"><div class="w-4 h-4 rounded-full border-2 border-gray-300"></div><span class="text-gray-800 font-bold">You</span></div>
                <span class="text-gray-800 text-xs font-bold">₹833</span>
              </div>
            </div>
            <button class="w-full mt-4 bg-[#128C7E] text-white font-bold py-3 rounded-xl shadow-md flex items-center justify-center gap-2 hover:bg-[#075E54] transition">${I('wallet', 18)} Pay with WA Pay</button>
          </div>
        </div>`, false, "snap-center")}
    </div>
  </div>`;

const NetworkTab = () => `
  <div class="flex flex-col lg:flex-row gap-10">
    <div class="flex-1 space-y-4">
      ${Four(
        "The WhatsApp Professional Card and intent driven networking. Users declare their professional identity natively. The AI Concierge orchestrates organic nudges based on shared intent.",
        "People lose touch with former colleagues because reaching out cold feels awkward. They need a contextual excuse to connect rather than a generic calendar reminder.",
        "Relying strictly on native WhatsApp data limits the initial network size compared to scraping external sites. However, it preserves absolute user trust and platform integrity.",
        "Do not scrape external professional networks. Do not use generic social data for professional nudges to avoid context collapse. Absolutely no health data integration.")}
    </div>
    <div class="lg:w-[560px] flex gap-6 overflow-x-auto pb-4 snap-x hide-scrollbar">
      ${Phone("Pro Settings", `
        <div class="h-full bg-white flex flex-col">
          <div class="bg-[#128C7E] text-white p-4">
            <h4 class="font-bold">Setup Professional Card</h4>
            <p class="text-xs text-[#DCF8C6]">Visible only to your Pro Circle</p>
          </div>
          <div class="p-5 space-y-5">
            <div>
              <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-1">Current Role</label>
              <div class="border-b-2 border-[#128C7E] py-2 font-bold text-gray-800 text-sm">Product Manager @ TechCorp</div>
            </div>
            <div>
              <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-2">Networking Intents</label>
              <div class="flex flex-wrap gap-2">
                <span class="bg-[#ECE5DD] text-[#075E54] px-3 py-1.5 rounded-md text-xs font-bold border border-gray-200">#GTM_Strategy</span>
                <span class="bg-[#ECE5DD] text-[#075E54] px-3 py-1.5 rounded-md text-xs font-bold border border-gray-200">#SaaS</span>
                <span class="bg-gray-50 text-gray-400 px-3 py-1.5 rounded-md text-xs font-bold border border-dashed border-gray-300">+ Add Tag</span>
              </div>
            </div>
            <div class="bg-[#E1F5E8] border border-[#25D366]/30 rounded-lg p-3 mt-4">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-[#075E54]">Sync with Verified Pro Network</span>
                <div class="w-8 h-5 bg-[#128C7E] rounded-full relative shadow-inner"><div class="w-4 h-4 bg-white rounded-full absolute top-0.5 right-0.5 shadow"></div></div>
              </div>
            </div>
            <button class="w-full bg-[#128C7E] hover:bg-[#075E54] text-white font-bold py-3 rounded-lg mt-4 shadow-md transition-colors">Save Card</button>
          </div>
        </div>`, false, "snap-center")}
      ${Phone("AI Concierge", `
        <div class="my-4 mx-2 bg-white p-5 rounded-2xl border border-gray-200 shadow-sm relative overflow-hidden">
          <div class="absolute top-0 right-0 p-2 opacity-5">${I('message-circle', 80, 'text-[#128C7E]')}</div>
          <div class="flex items-center gap-2 mb-3">
            <span class="w-6 h-6 rounded-full bg-[#128C7E] flex items-center justify-center shadow-md"><span class="text-white text-[10px]">✨</span></span>
            <span class="text-xs font-bold text-[#075E54] uppercase tracking-wider">Network Match</span>
          </div>
          <p class="text-sm text-gray-800 mb-5 leading-relaxed font-medium">
            <strong>John Doe</strong> just updated their professional intent. You both tagged <span class="text-[#128C7E] font-bold bg-[#ECE5DD] px-1 rounded">#GTM_Strategy</span>. Would you like to reconnect regarding recent market changes?
          </p>
          <div class="flex gap-2">
            <button class="flex-1 bg-[#128C7E] text-white text-xs font-bold py-2.5 rounded-lg shadow-sm hover:bg-[#075E54] transition">Draft Message</button>
            <button class="flex-1 bg-gray-100 text-gray-600 text-xs font-bold py-2.5 rounded-lg border border-gray-200 hover:bg-gray-200 transition">Dismiss</button>
          </div>
        </div>`, false, "snap-center")}
    </div>
  </div>`;

const funnelStep = (bg, border, t1, t2, c1, c2, extra = '') => `
  <div class="flex-1 w-full ${bg} p-4 rounded-xl border ${border} shadow-sm ${extra}">
    <div class="font-bold ${c1} text-sm">${t1}</div>
    <div class="text-[10px] ${c2} mt-1 font-bold uppercase">${t2}</div>
  </div>`;
const arrow = `<span class="text-gray-400 hidden md:block">${I('arrow-right', 24)}</span>`;

const EcosystemTab = () => `
  <div class="flex flex-col gap-10">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="space-y-4">
        ${Info("The Product", "layers", "The Zero Party Data Bridge for Meta Advertising. By mapping the WhatsApp Professional identity to the broader Meta graph, we unlock hyper targeted B2B advertising for SaaS and Real Estate outside of WhatsApp.")}
        ${Info("Customer Insight", "lightbulb", "Data companies make a lot of money but barely anyone builds a funnel. Creating a generic top of funnel is great but targeting at scale brings massive ROI. Advertisers desperately need B2B targeting outside of dedicated professional networks.", "insight")}

      <div class="space-y-4">
        ${Info("Tradeoffs", "alert-triangle", "Asking for explicit B2B curation opt in reduces the total data pool. However, it completely prevents privacy backlash and regulatory scrutiny.", "tradeoff")}

      </div>
    </div>

    <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm">
      <h4 class="font-bold text-gray-900 mb-6 flex items-center gap-2 uppercase tracking-wide text-sm">${I('trending-up', 18, 'text-[#128C7E]')} The Massive ROI Funnel</h4>
      <div class="flex flex-col md:flex-row items-center justify-between gap-4 text-center">
        ${funnelStep("bg-[#f0f2f5]", "border-gray-300", "Consumer Intent", "Needs a Service", "text-gray-800", "text-gray-500")}
        ${arrow}
        ${funnelStep("bg-[#E1F5E8]", "border-[#25D366]/50", "WA Execution", "AI Job Brief generated", "text-[#075E54]", "text-[#128C7E]")}
        ${arrow}
        ${funnelStep("bg-[#DCF8C6]", "border-[#25D366]", "Zero-Party Data", "Opt In B2B Profile", "text-[#075E54]", "text-[#128C7E]")}
        ${arrow}
        ${funnelStep("", "border-[#075E54]", "Targeted IG Ads", "Massive ROI Achieved", "text-white", "text-[#DCF8C6]", "bg-gradient-to-br from-[#128C7E] to-[#075E54] shadow-lg")}
      </div>
    </div>

    <div class="flex justify-center mt-4 overflow-x-auto pb-2">
      <div class="w-[600px] h-[420px] shrink-0 bg-black rounded-[2rem] border-8 border-gray-900 shadow-2xl overflow-hidden flex relative">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-6 bg-gray-900 rounded-b-2xl z-50"></div>
        <div class="w-1/2 h-full bg-[#f0f2f5] border-r border-gray-800 flex flex-col relative z-10">
          <div class="bg-[#128C7E] text-white py-3 px-4 flex items-center pt-8 shadow-sm"><span class="font-bold text-sm">WhatsApp Identity</span></div>
          <div class="p-5 space-y-4 flex-1">
            <div class="text-center mt-4 bg-white p-4 rounded-xl shadow-sm border border-gray-200">
              <div class="w-16 h-16 rounded-full bg-gray-100 mx-auto border-2 border-[#25D366] mb-3 flex items-center justify-center">${I('briefcase', 24, 'text-[#128C7E]')}</div>
              <div class="font-bold text-gray-900 text-sm">Builder Operator</div>
              <div class="text-xs text-gray-500 font-bold uppercase tracking-wide mt-1">B2B Product Strategy</div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
              <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-3">Declared Intent</div>
              <span class="bg-[#E1F5E8] text-[#075E54] px-3 py-1.5 rounded-md text-xs font-bold border border-[#25D366]/30">#EnterpriseSaaS</span>
            </div>
          </div>
        </div>
        <div class="w-1/2 h-full bg-white flex flex-col relative z-10">
          <div class="flex justify-between items-center p-3 pt-8 border-b border-gray-200 bg-gray-50">

            <div class="flex gap-3 text-gray-700">${I('heart', 16)}${I('message-square', 16)}</div>
          </div>
          <div class="p-3 bg-white">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-full bg-[#128C7E] text-white flex items-center justify-center font-bold text-xs shadow-sm">C</div>
              <div>
                <div class="text-xs font-bold text-gray-900">CloudScale ERP</div>

              </div>
            </div>
          </div>
          <div class="flex-1 bg-gradient-to-tr from-gray-900 to-gray-800 flex items-center justify-center text-center p-5 relative overflow-hidden">
            <div class="absolute inset-0 opacity-20" style="background-image:radial-gradient(#128C7E 1px,transparent 1px);background-size:10px 10px"></div>

/* ---------- App shell ---------- */
const panels = [SummaryTab, MarketplaceTab, UtilityTab, NetworkTab, EcosystemTab];
let active = 0;

function render() {
  document.getElementById('tabs').innerHTML = tabs.map((t, i) => `
    <button data-i="${i}" class="flex-1 py-4 px-2 text-center text-sm font-bold uppercase tracking-wide transition-all duration-200 flex flex-col items-center gap-1 ${
      i === active ? 'text-[#075E54] border-b-4 border-[#25D366] bg-white'
                   : 'text-teal-100 hover:text-white hover:bg-white/10 border-b-4 border-transparent'}">
      <div class="flex items-center gap-2">${I(t.icon, 18)} ${t.title}</div>
      <span class="text-[10px] px-2 py-0.5 rounded-full ${i === active ? 'bg-[#E1F5E8] text-[#128C7E]' : 'bg-black/20'}">${t.label}</span>
    </button>`).join('');
  document.getElementById('content').innerHTML = panels[active]();
  lucide.createIcons();
}

document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-i]');
  if (b) { active = +b.dataset.i; render(); }
});
render();
</script>
</body>
</html>
