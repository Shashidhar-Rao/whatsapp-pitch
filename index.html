<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp: The Execution Layer</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel for compiling JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Import Map for React and Lucide Icons -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.2.0",
          "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
          "lucide-react": "https://esm.sh/lucide-react@0.294.0"
        }
      }
    </script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState } from 'react';
        import { createRoot } from 'react-dom/client';
        import { MessageCircle, Wallet, Briefcase, TrendingUp, Check, CheckCheck, Camera, Paperclip, Mic, MoreVertical, ArrowLeft, FileText, Lightbulb, AlertTriangle, XOctagon, Layers, Heart } from 'lucide-react';

        const WAPitch = () => {
          const [activeTab, setActiveTab] = useState(0);

          const tabs = [
            { id: 0, title: "Summary", icon: <FileText size={18} />, label: "Vision" },
            { id: 1, title: "Marketplace", icon: <MessageCircle size={18} />, label: "Services" },
            { id: 2, title: "Utility", icon: <Wallet size={18} />, label: "Context" },
            { id: 3, title: "Network", icon: <Briefcase size={18} />, label: "Circles" },
            { id: 4, title: "Ecosystem", icon: <TrendingUp size={18} />, label: "ROI" },
          ];

          return (
            <div className="max-w-6xl mx-auto p-4 md:p-6 bg-gray-50 min-h-screen text-gray-800 flex flex-col font-sans">
              
              {/* Header */}
              <div className="mb-8">
                <h1 className="text-3xl md:text-4xl font-extrabold text-[#075E54] tracking-tight">WhatsApp: The Execution Layer</h1>
                <p className="text-gray-500 mt-2 text-lg font-medium">A Builder-Operator Proposal</p>
              </div>

              {/* Navigation Tabs */}
              <div className="flex bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mb-6 flex-wrap">
                {tabs.map((tab) => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex-1 py-4 px-2 text-center text-sm font-bold uppercase tracking-wide transition-all duration-200 flex flex-col items-center gap-1 min-w-[80px] ${
                      activeTab === tab.id
                        ? 'text-[#075E54] border-b-4 border-[#25D366] bg-green-50'
                        : 'text-gray-400 hover:bg-gray-50 border-b-4 border-transparent'
                    }`}
                  >
                    {tab.icon}
                    <span className="hidden md:block">{tab.title}</span>
                    <span className="md:hidden text-xs">{tab.label}</span>
                  </button>
                ))}
              </div>

              {/* Tab Content Area */}
              <div className="flex-grow">
                {activeTab === 0 && <SummaryTab />}
                {activeTab === 1 && <MarketplaceTab />}
                {activeTab === 2 && <UtilityTab />}
                {activeTab === 3 && <NetworkTab />}
                {activeTab === 4 && <EcosystemTab />}
              </div>
            </div>
          );
        };

        // --- Reusable Components ---
        const InfoBlock = ({ title, icon, content, type = 'default' }) => {
          const styles = {
            default: "bg-white border-gray-200 text-gray-800",
            insight: "bg-[#E1F5E8] border-[#25D366]/30 text-[#075E54]",
            tradeoff: "bg-orange-50 border-orange-200 text-orange-900",
            dont: "bg-red-50 border-red-200 text-red-900"
          };
          
          const iconColors = {
            default: "text-[#128C7E]",
            insight: "text-[#128C7E]",
            tradeoff: "text-orange-600",
            dont: "text-red-600"
          };

          return (
            <div className={`p-5 rounded-xl border ${styles[type]} shadow-sm`}>
              <div className="flex items-center gap-2 mb-2">
                <span className={iconColors[type]}>{icon}</span>
                <h3 className="font-bold text-lg">{title}</h3>
              </div>
              <div className="text-sm leading-relaxed opacity-90">{content}</div>
            </div>
          );
        };

        const MobileWireframe = ({ children, headerTitle, withInput = true, bgColor = "bg-[#ECE5DD]" }) => (
          <div className={`w-[280px] h-[500px] border-[6px] border-gray-900 rounded-[2.5rem] overflow-hidden flex flex-col relative shadow-xl shrink-0 mx-auto ${bgColor}`}>
            <div className="bg-[#075E54] text-white p-4 pt-8 flex items-center gap-3 shrink-0 shadow-md z-10">
              <ArrowLeft size={20} />
              <div className="w-8 h-8 rounded-full bg-gray-300 flex items-center justify-center overflow-hidden">
                <span className="text-gray-600 text-xs font-bold">AI</span>
              </div>
              <div className="font-bold flex-1 truncate">{headerTitle}</div>
              <MoreVertical size={20} />
            </div>
            
            <div className="flex-1 p-3 overflow-y-auto flex flex-col gap-3 text-sm">
              {children}
            </div>

            {withInput && (
              <div className="bg-[#f0f2f5] p-2 flex items-center gap-2 shrink-0">
                <div className="bg-white rounded-full flex-1 flex items-center px-4 py-2 shadow-sm gap-2">
                  <div className="text-gray-400"><Heart size={18} /></div>
                  <div className="text-gray-400 flex-1 text-sm">Message</div>
                  <div className="text-gray-400"><Paperclip size={18} /></div>
                  <div className="text-gray-400"><Camera size={18} /></div>
                </div>
                <div className="bg-[#128C7E] w-10 h-10 rounded-full flex items-center justify-center text-white shadow-sm shrink-0">
                  <Mic size={20} />
                </div>
              </div>
            )}
          </div>
        );

        // --- Tabs ---
        const SummaryTab = () => (
          <div className="space-y-6">
            
            {/* Executive Overview: Problem & Recommended Solution */}
            <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-200 space-y-6">
              <div className="border-b border-gray-100 pb-4">
                <h2 className="text-2xl font-bold text-[#075E54]">Executive Summary</h2>
                <p className="text-sm text-gray-500 mt-1">Product Architecture, Ecosystem Value, and Strategic Tradeoffs</p>
              </div>

              <div className="grid md:grid-cols-2 gap-6">
                <div className="space-y-2">
                  <h3 className="text-sm font-bold uppercase tracking-wider text-red-700">1. The Problem Statement</h3>
                  <p className="text-gray-700 text-sm leading-relaxed">
                    WhatsApp is already the shared language for three billion people, yet communication remains completely disconnected from execution. Users discuss local services, coordinate group expenses, and maintain professional contacts inside chats, only to leave the app to finish those tasks on external tools. Meanwhile, Meta leaves high-margin B2B revenue on the table because WhatsApp lacks structured intent capture and verified professional data.
                  </p>
                </div>

                <div className="space-y-2">
                  <h3 className="text-sm font-bold uppercase tracking-wider text-[#075E54]">2. The Recommended Solution (The Build)</h3>
                  <p className="text-gray-700 text-sm leading-relaxed">
                    Transform WhatsApp into a Conversational Execution Layer without adding a WeChat-style menu or placing ads in personal chats. This build introduces three native, intent-driven modules: an AI Services Marketplace powered by a Pay-to-Quote token economy, on-device Live Shared Applets and paid B2B Group Agents for utility, and an opt-in Professional Work Card that automates networking while feeding zero-party B2B data into the Meta ad graph.
                  </p>
                </div>
              </div>
            </div>

            {/* How Everything Comes Together */}
            <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-200">
              <h3 className="text-sm font-bold uppercase tracking-wider text-[#075E54] mb-4">3. How Everything Comes Together (The Compounding Value)</h3>
              <p className="text-gray-600 text-sm mb-6 leading-relaxed">
                Each feature works independently to solve daily user friction, but their real power is how they reinforce one another to drive payments, B2B software revenue, and ecosystem-wide ad targeting.
              </p>

              <div className="grid md:grid-cols-3 gap-4 items-stretch">
                <div className="bg-[#E1F5E8]/60 border border-[#25D366]/30 p-5 rounded-xl flex flex-col justify-between">
                  <div>
                    <div className="flex items-center gap-2 text-[#075E54] font-bold mb-2">
                      <Wallet size={18} />
                      <span>Contextual Utility</span>
                    </div>
                    <p className="text-xs text-gray-700 leading-relaxed">
                      On-device OCR turns shared receipts and lists into live chat applets that drive WhatsApp Pay. For B2B teams, paid Group Agents sync customer group chats directly to CRMs and ERPs in real time.
                    </p>
                  </div>
                  <div className="mt-4 pt-3 border-t border-[#25D366]/20 text-xs font-bold text-[#075E54]">
                    Value: Consumer Retention, Payments & B2B SaaS
                  </div>
                </div>

                <div className="bg-blue-50/70 border border-blue-200 p-5 rounded-xl flex flex-col justify-between">
                  <div>
                    <div className="flex items-center gap-2 text-blue-900 font-bold mb-2">
                      <MessageCircle size={18} />
                      <span>AI Services Marketplace</span>
                    </div>
                    <p className="text-xs text-gray-700 leading-relaxed">
                      Users send text, photos, or vernacular voice notes to Meta AI to find verified local pros. Professionals pay a one-time verification fee and spend tokens to submit actionable Quote Cards directly in chat.
                    </p>
                  </div>
                  <div className="mt-4 pt-3 border-t border-blue-200 text-xs font-bold text-blue-900">
                    Value: High-Margin B2B Lead Generation
                  </div>
                </div>

                <div className="bg-purple-50/70 border border-purple-200 p-5 rounded-xl flex flex-col justify-between">
                  <div>
                    <div className="flex items-center gap-2 text-purple-900 font-bold mb-2">
                      <Briefcase size={18} />
                      <span>Work Cards & Meta Ads</span>
                    </div>
                    <p className="text-xs text-gray-700 leading-relaxed">
                      Opt-in Professional Cards power private AI networking nudges via Threads. Mapped to Instagram and Facebook, this zero-party data lets Meta capture high-ticket SaaS and Real Estate B2B ad spend.
                    </p>
                  </div>
                  <div className="mt-4 pt-3 border-t border-purple-200 text-xs font-bold text-purple-900">
                    Value: Disrupts LinkedIn's B2B Ad Monopoly
                  </div>
                </div>
              </div>
            </div>

            {/* Risks and Tradeoffs */}
            <div className="grid md:grid-cols-2 gap-6">
              <InfoBlock 
                type="tradeoff"
                title="4. Core Strategic Tradeoffs" 
                icon={<AlertTriangle />} 
                content={
                  <ul className="list-disc pl-4 space-y-2 mt-1">
                    <li><strong>Intent Over GMV:</strong> Charging professionals upfront tokens to quote means giving up a 5% commission on completed jobs. This tradeoff protects software margins by eliminating off-platform cash leakage and human refund arbitration.</li>
                    <li><strong>Zero In-Thread Ads:</strong> Keeping the WhatsApp inbox completely ad-free sacrifices direct impression revenue inside the app, but preserves user trust and shifts B2B ad monetization to Instagram and Facebook.</li>
                    <li><strong>Free Networking Wedge:</strong> Giving away AI networking nudges for free delays direct SaaS revenue, but is necessary to build network liquidity before monetizing Verified Pro badges.</li>
                  </ul>
                }
              />

              <InfoBlock 
                type="dont"
                title="5. Execution Risks & Mitigations" 
                icon={<XOctagon />} 
                content={
                  <ul className="list-disc pl-4 space-y-2 mt-1">
                    <li><strong>Privacy Backlash:</strong> Linking Work Cards to Meta Ads risks making users feel surveilled. Mitigation: Strict Glass Box opt-in framing and 100% on-device Neural Engine processing for all image OCR.</li>
                    <li><strong>Cryptographic Complexity:</strong> Syncing live, mutating Applet states (like shared checklists and bill splits) across multiple phones under E2E encryption requires dedicated state-sync engineering.</li>
                    <li><strong>Behavioral Inertia:</strong> Users are conditioned to Google local services rather than ask a chat AI. Mitigation: Lead with multi-modal frictionless triggers like voice notes and photos rather than blank search bars.</li>
                  </ul>
                }
              />
            </div>

          </div>
        );

        const MarketplaceTab = () => (
          <div className="space-y-6">
            <div className="bg-white p-6 rounded-2xl shadow-sm mb-6 flex flex-col md:flex-row gap-8">
              
              <div className="md:w-1/2 space-y-4">
                <h2 className="text-xl font-bold text-gray-800 border-b pb-2">Conversational Services Marketplace</h2>
                <p className="text-gray-600 mb-6">
                  Users do not want a Yellow Pages directory inside WhatsApp. They want to ask for help naturally. 
                  By utilizing the AI bar as the primary search entry point, we capture high-intent queries (including vernacular voice notes) and route them anonymously to verified professionals who pay a token to submit a quote.
                </p>
                
                <InfoBlock 
                  type="insight"
                  title="Customer Insight" 
                  icon={<Lightbulb />} 
                  content="People trust WhatsApp for communication, not web browsing. A user is far more likely to send a photo of a broken pipe to the Meta AI and ask for a plumber than navigate a dense category menu." 
                />
                
                <InfoBlock 
                  type="tradeoff"
                  title="Tradeoff: The Token Economy" 
                  icon={<AlertTriangle />} 
                  content="We monetize the lead (charging the professional a token to quote) rather than taking a 5% cut of the final transaction. We lose total GMV capture, but we completely avoid the operations nightmare of refund disputes and off-platform cash payments." 
                />
                
                <InfoBlock 
                  type="dont"
                  title="Strict Guardrail" 
                  icon={<XOctagon />} 
                  content="DO NOT build a WeChat-style Discover tab. DO NOT arbitrate service disputes. WhatsApp is the execution bridge, not the fulfillment center." 
                />
              </div>

              <div className="md:w-1/2 relative bg-gray-100 rounded-xl p-4 overflow-hidden border border-gray-200">
                <div className="flex flex-col gap-6 items-center">
                  <div className="flex flex-wrap gap-6 justify-center w-full scale-90 origin-top">
                    {/* Screen 1: The Request */}
                    <MobileWireframe headerTitle="Meta AI Concierge">
                      <div className="bg-[#DCF8C6] p-2 rounded-lg rounded-tr-none self-end max-w-[85%] shadow-sm relative">
                        <img src="https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=400&q=80" alt="pipe" className="w-full rounded mb-1 object-cover h-24" />
                        <span className="text-gray-800">My kitchen pipe burst, need someone to fix it today.</span>
                        <div className="text-[10px] text-gray-500 text-right mt-1">10:41 AM <CheckCheck size={12} className="inline text-blue-500"/></div>
                      </div>
                      
                      <div className="bg-white p-2 rounded-lg rounded-tl-none self-start max-w-[90%] shadow-sm">
                        <span className="text-gray-800 font-medium block mb-1">I found 3 plumbers nearby available today.</span>
                        <div className="border border-gray-200 rounded p-2 mb-2 bg-gray-50">
                          <div className="font-bold">John Doe Plumbing</div>
                          <div className="text-xs text-green-600 flex items-center gap-1"><Check size={12}/> Verified Pro</div>
                          <div className="text-xs mt-1">Quote: ₹850</div>
                          <button className="w-full bg-[#128C7E] text-white text-xs py-1.5 rounded mt-2 font-bold">Accept & Book</button>
                        </div>
                        <div className="text-[10px] text-gray-500 text-right">10:42 AM</div>
                      </div>
                    </MobileWireframe>

                    {/* Screen 2: The B2B View */}
                    <MobileWireframe headerTitle="WA Pro Leads" bgColor="bg-slate-800">
                      <div className="bg-slate-700 p-3 rounded-lg shadow-sm border border-slate-600">
                        <div className="text-white text-xs font-bold uppercase tracking-wider mb-2 flex justify-between">
                          <span>New Local Job</span>
                          <span className="bg-green-500/20 text-green-400 px-2 rounded">Plumbing</span>
                        </div>
                        <img src="https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=400&q=80" alt="pipe" className="w-full rounded mb-2 object-cover h-20 opacity-80" />
                        <div className="text-slate-300 text-sm mb-3">"My kitchen pipe burst, need someone to fix it today."</div>
                        <div className="text-xs text-slate-400 mb-3">2.4 km away</div>
                        
                        <div className="flex gap-2">
                          <button className="flex-1 bg-slate-600 text-white text-xs py-2 rounded font-bold">Pass</button>
                          <button className="flex-1 bg-green-500 text-white text-xs py-2 rounded font-bold">Quote (1 Token)</button>
                        </div>
                      </div>
                    </MobileWireframe>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );

        const UtilityTab = () => (
          <div className="space-y-6">
            
            {/* Section 1: B2C Contextual Utility (Applets) */}
            <div className="bg-white p-6 rounded-2xl shadow-sm flex flex-col md:flex-row gap-8">
              
              <div className="md:w-1/2 relative bg-gray-100 rounded-xl p-4 overflow-hidden border border-gray-200 flex justify-center items-center">
                 <MobileWireframe headerTitle="Weekend Trip Group">
                    <div className="bg-white p-3 rounded-lg rounded-tl-none self-start w-[95%] shadow-sm border border-gray-200">
                      <div className="text-[#075E54] text-xs font-bold mb-1">Alex</div>
                      <div className="font-bold text-gray-800 border-b pb-2 mb-2 flex justify-between items-center">
                        <span>Weekend Dinner Split</span>
                        <span className="bg-[#E1F5E8] text-[#075E54] text-xs px-2 py-1 rounded">Live</span>
                      </div>
                      
                      <div className="space-y-2 text-sm">
                        <div className="flex justify-between items-center">
                          <span className="text-gray-600 line-through">John Doe</span>
                          <span className="text-gray-400 text-xs">Paid</span>
                        </div>
                        <div className="flex justify-between items-center font-medium">
                          <span className="text-gray-800">You</span>
                          <span className="text-gray-800">₹850</span>
                        </div>
                        <div className="flex justify-between items-center">
                          <span className="text-gray-600">Sarah</span>
                          <span className="text-orange-500 text-xs">Owes ₹1,200</span>
                        </div>
                      </div>
                      
                      <div className="w-full bg-gray-200 h-1.5 rounded-full mt-3 overflow-hidden">
                        <div className="bg-[#25D366] w-1/3 h-full"></div>
                      </div>
                      
                      <button className="w-full bg-[#128C7E] text-white text-xs py-2 rounded mt-3 font-bold flex justify-center items-center gap-1">
                        Settle ₹850 via WA Pay
                      </button>
                    </div>
                 </MobileWireframe>
              </div>

              <div className="md:w-1/2 space-y-4">
                <h2 className="text-xl font-bold text-gray-800 border-b pb-2">B2C Utility: Live Shared Applets</h2>
                <p className="text-gray-600 mb-6">
                  Adding utility to chat usually causes visual bloat. We solve this by introducing Live Shared Applets. 
                  When a receipt is shared, strictly on-device ML parses it and creates a single, updating UI card rather than sending 15 new text messages for every debt update.
                </p>
                
                <InfoBlock 
                  type="insight"
                  title="Customer Insight" 
                  icon={<Lightbulb />} 
                  content="Splitting bills is mathematically simple but socially complex. Aggressive auto-invoicing ruins the group vibe. Applets act as a passive Shared Canvas that users interact with on their own terms." 
                />
                
                <InfoBlock 
                  type="tradeoff"
                  title="The Trojan Horse" 
                  icon={<AlertTriangle />} 
                  content="Contextual expense sharing is the ultimate wedge for WhatsApp Pay. By placing the settlement button natively inside the social coordination widget, we bypass external UPI apps." 
                />
                
                <InfoBlock 
                  type="dont"
                  title="Strict Guardrail" 
                  icon={<XOctagon />} 
                  content="DO NOT send image data to Meta cloud servers for processing. All OCR and visual intelligence must run strictly on the device's Neural Engine to protect consumer privacy." 
                />
              </div>

            </div>

            {/* Section 2: B2B Contextual Utility (Paid Group Agents) */}
            <div className="bg-white p-6 rounded-2xl shadow-sm flex flex-col md:flex-row gap-8">
              
              <div className="md:w-1/2 space-y-4">
                <h2 className="text-xl font-bold text-gray-800 border-b pb-2">B2B Utility: Paid Group Data Agents</h2>
                <p className="text-gray-600 mb-6">
                  Businesses run entire operations out of customer WhatsApp groups, yet the official API only supports 1-on-1 chats. Today, teams rely on fragile, grey-market scrapers to extract group chats in real time. A native, paid WhatsApp Group Agent connects directly to a company's CRM or ERP via official webhooks, turning a risky hack into high-margin B2B SaaS revenue.
                </p>
                
                <InfoBlock 
                  type="insight"
                  title="Customer Insight" 
                  icon={<Lightbulb />} 
                  content="B2B customers refuse to log into separate client portals or ticketing dashboards. They want to drop a message in their existing WhatsApp group and get an instant, accurate answer." 
                />
                
                <InfoBlock 
                  type="tradeoff"
                  title="Monetization & Liability" 
                  icon={<AlertTriangle />} 
                  content="Charge a flat B2B SaaS fee per active group or webhook tier. Opening E2E-encrypted group chats to external business databases introduces data-handling liability, so Meta must shift compliance to the business and strictly scope agent permissions." 
                />
                
                <InfoBlock 
                  type="dont"
                  title="Strict Guardrail" 
                  icon={<XOctagon />} 
                  content="DO NOT allow silent background scraping. The agent must carry a permanent Business Bot badge and a clear banner at the top of the group so customers always know messages sync to the company's database." 
                />
              </div>

              <div className="md:w-1/2 relative bg-gray-100 rounded-xl p-4 overflow-hidden border border-gray-200 flex justify-center items-center">
                 <MobileWireframe headerTitle="Acme Logistics <> Client">
                    <div className="bg-blue-50 border border-blue-200 text-blue-800 text-[10px] p-2 rounded-lg text-center font-medium shadow-sm">
                      Verified Business Agent active. Messages sync to Acme ERP.
                    </div>

                    <div className="bg-white p-2.5 rounded-lg rounded-tl-none self-start max-w-[85%] shadow-sm">
                      <div className="text-[#075E54] text-xs font-bold mb-0.5">Alex (Client)</div>
                      <span className="text-gray-800 text-xs">Hey team, where is shipment #402? Need the ETA for the warehouse.</span>
                      <div className="text-[10px] text-gray-400 text-right mt-1">11:02 AM</div>
                    </div>

                    <div className="bg-[#E1F5E8] border border-[#25D366]/40 p-2.5 rounded-lg rounded-tr-none self-end max-w-[90%] shadow-sm">
                      <div className="flex items-center justify-between mb-1">
                        <span className="text-[#075E54] text-xs font-bold">Acme Ops Agent</span>
                        <span className="bg-[#075E54] text-white text-[9
